<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Pessoas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Gerenciamento de Pessoas</h1>

  <div class="card">
    <h2 id="form-titulo">Cadastrar Pessoa</h2>
    <form id="form-pessoa">
      <input type="hidden" id="pessoa-id">
      
      <div class="form-group">
        <input type="text" id="nome" placeholder="Nome" required>
        <input type="number" id="idade" placeholder="Idade" required min="0">
      </div>

      <button type="submit" class="btn-salvar" id="btn-salvar">Cadastrar</button>
      <button type="button" class="btn-cancelar" id="btn-cancelar" onclick="limparFormulario()">Cancelar</button>
    </form>
  </div>

  <!-- Tabela de Pessoas -->
  <div class="card">
    <h2>Lista de Pessoas</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Idade</th>
          <th class="actions">Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-pessoas">
        <!-- Linhas inseridas via JS -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
